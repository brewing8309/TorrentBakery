[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentbakery"
version = "0.1.0"
description = "Bake torrents, screenshot sheets and forum posts from video files and Stash scenes"
requires-python = ">=3.11"
dependencies = ["torf>=4.2", "Pillow>=10.1", "httpx>=0.27", "Jinja2>=3.1", "typer>=0.12", "tomli-w>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tb = "torrentbakery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torrentbakery = ["render/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
