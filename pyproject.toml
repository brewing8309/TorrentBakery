[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torrentbakery"
dynamic = ["version"]
description = "Bake torrents, screenshot sheets and forum posts from video files and Stash scenes"
requires-python = ">=3.11"
dependencies = ["torf>=4.2", "Pillow>=10.1", "httpx>=0.27", "Jinja2>=3.1", "typer>=0.12", "tomli-w>=1.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
tb = "torrentbakery.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torrentbakery = ["render/templates/*.j2", "web/templates/*.html", "web/static/css/*", "web/static/fonts/*", "web/static/brand/*", "tags/*.toml", "trackers/templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = {attr = "torrentbakery.__version__"}
