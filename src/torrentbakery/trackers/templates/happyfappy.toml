schema = 1
id = "happyfappy"
name = "HappyFappy"
engine = "gazelle"
description = "Gazelle tracker. Fills in and posts upload.php with your browser session."
base_url = "https://www.happyfappy.net"
source = "HF"
private = true

[[auth.credentials]]
field = "cookie"
label = "Login cookies"
required = true
help = "Log in at www.happyfappy.net, then copy the values of these cookies (browser developer tools -> Application/Storage -> Cookies). They expire; paste fresh ones when Test login says so."
cookies = [
  { name = "cid", label = "Account id" },
  { name = "sid", label = "Session" },
]

[images]
# empty = any host works (the tracker hotlinks the cover and the post's images)
hosts = []

[gazelle]
# element ids of the upload form fields (the defaults suit stash-empornium-style Gazelle forms)
field_ids = {}
