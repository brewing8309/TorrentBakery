<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TorrentBakery{% endblock %}</title>
<meta name="description" content="Bakes torrents, animated covers, screenshot sheets and forum posts from video files and Stash scenes.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBF9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181C1F">
<meta property="og:type" content="website">
<meta property="og:title" content="TorrentBakery">
<meta property="og:description" content="Torrent, animated cover, 5×7 screenshot sheet, MediaInfo and a forum post from one source.">
<meta property="og:image" content="{{ request.base_url }}static/brand/og-image.png">
<link rel="icon" href="/static/brand/favicon.ico" sizes="48x48">
<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="manifest" href="/static/brand/site.webmanifest">
<link rel="preload" href="/static/fonts/atkinson-next-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/big-shoulders-display-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
// before the first paint, so a saved theme never flashes the other one
(function () {
  var root = document.documentElement, dark = window.matchMedia("(prefers-color-scheme: dark)"), saved = null;
  try { saved = localStorage.getItem("tb-theme"); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  window.tbThemeNow = function () { root.dataset.themeNow = root.dataset.theme || (dark.matches ? "dark" : "light"); };
  dark.addEventListener("change", window.tbThemeNow);
  window.tbThemeNow();
})();
</script>
<link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_v }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_v }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% set path = request.url.path %}
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/" aria-label="TorrentBakery, start page">{% include "_logo.html" %}</a>
    {% if not bare %}<nav class="nav" aria-label="Main">
      <a href="/"{% if path == "/" or path.startswith("/jobs") %} aria-current="page"{% endif %}>Bake</a>
      <a href="/history"{% if path.startswith("/history") %} aria-current="page"{% endif %}>History</a>
      <a href="/settings"{% if path.startswith("/settings") %} aria-current="page"{% endif %}>Settings</a>
    </nav>{% endif %}
    {% if request.state.auth_on and not bare %}<form method="post" action="/logout" class="inline"><button class="ghost">Log out</button></form>{% endif %}
    <button type="button" class="ghost icon theme-toggle" id="theme-toggle" aria-label="Switch between light and dark theme">
      <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .8v2M8 13.200v2M.8 8h2M13.200 8h2M2.900 2.900l1.400 1.400M11.700 11.700l1.400 1.400M2.900 13.100l1.400-1.400M11.700 4.300l1.400-1.400" stroke="currentColor" stroke-width="1.500" fill="none"/></svg>
      <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.800 10.300A6.200 6.200 0 0 1 5.700 2.200a6.200 6.200 0 1 0 8.100 8.100Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<main class="page" id="main">{% block body %}{% endblock %}</main>
<script>
document.getElementById("theme-toggle").addEventListener("click", function () {
  var next = document.documentElement.dataset.themeNow === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("tb-theme", next); } catch (e) {}
  window.tbThemeNow();
});
</script>
</body>
</html>
